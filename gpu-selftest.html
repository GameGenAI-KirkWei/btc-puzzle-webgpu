<!DOCTYPE html>
<html><body><pre id="o">...</pre>
<script type="module">
import { getPublicKey, ProjectivePoint, CURVE } from './lib/noble-secp256k1.js';
import {
  addressToHash160, hash160ToAddress, privateKeyToWIF, bytesToHex,
  bigintTo32BE, bigintToLimbsLE, limbsLEToBigint, hash160ToWordsBE, hash160,
} from './lib/crypto-utils.js';

const o = document.getElementById('o');
const log = (s) => { o.textContent += '\n' + s; console.log(s); };

const VECTORS = {
  key1Addr: '1BgGZ9tcN4rm9KBzDn7KprQz87SZ26SAMH',
  key2Addr: '1cMh228HTCiwS8ZsaakH8A8wze1JR5ZsP',
  key3Addr: '1CUNEBjYrCn2y1SdiUMohaKUi4wpP326Lb',
  puzzle71Hash160: 'f6f5431d25bbf7b12e8add9af5e3475c44a0a5b8',
  puzzle71Addr: '1PWo3JeB9jrGwfHDNpdGK54CRas7fsVzXU',
};

function affineFromKey(k) {
  const pub = getPublicKey(bigintTo32BE(k), true);
  const point = ProjectivePoint.fromHex(pub);
  return { x: bigintToLimbsLE(point.x), y: bigintToLimbsLE(point.y) };
}
function packAff(x,y){ const u=new Uint32Array(16); u.set(x,0); u.set(y,8); return u; }
function buildOffsetTable(keysPerThread) {
  const table = new Uint32Array(256);
  for (let bit = 0; bit < 16; bit++) {
    const scalar = BigInt(keysPerThread) * (1n << BigInt(bit));
    const aff = affineFromKey(scalar % CURVE.n);
    table.set(aff.x, bit * 16); table.set(aff.y, bit * 16 + 8);
  }
  return table;
}

async function runChunk(device, pipeline, startKey, count, targetWords) {
  let threadCount = 64;
  while (threadCount * 2 <= count && threadCount < 4096) threadCount *= 2;
  let keysPerThread = Math.max(48, Math.ceil(Math.ceil(count / threadCount) / 48) * 48);
  const base = affineFromKey(startKey);
  const G = affineFromKey(1n);
  const offsetTable = buildOffsetTable(keysPerThread);
  const uniformData = new ArrayBuffer(64);
  const u32 = new Uint32Array(uniformData);
  const sk = bigintToLimbsLE(startKey);
  u32[0]=targetWords[0];u32[1]=targetWords[1];u32[2]=targetWords[2];u32[3]=targetWords[3];u32[4]=targetWords[4];
  u32[5]=keysPerThread; u32[6]=0; u32[7]=threadCount;
  for (let i=0;i<8;i++) u32[8+i]=sk[i];
  const uniformBuf = device.createBuffer({size:64, usage:GPUBufferUsage.UNIFORM|GPUBufferUsage.COPY_DST});
  device.queue.writeBuffer(uniformBuf,0,uniformData);
  const baseBuf = device.createBuffer({size:64, usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
  device.queue.writeBuffer(baseBuf,0,packAff(base.x,base.y));
  const offBuf = device.createBuffer({size:offsetTable.byteLength, usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
  device.queue.writeBuffer(offBuf,0,offsetTable);
  const gBuf = device.createBuffer({size:64, usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_DST});
  device.queue.writeBuffer(gBuf,0,packAff(G.x,G.y));
  const resultBuf = device.createBuffer({size:48, usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC|GPUBufferUsage.COPY_DST});
  device.queue.writeBuffer(resultBuf,0,new Uint32Array(12));
  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      {binding:0, resource:{buffer:uniformBuf}},
      {binding:1, resource:{buffer:baseBuf}},
      {binding:2, resource:{buffer:offBuf}},
      {binding:3, resource:{buffer:gBuf}},
      {binding:4, resource:{buffer:resultBuf}},
    ],
  });
  const t0 = performance.now();
  const enc = device.createCommandEncoder();
  const pass = enc.beginComputePass();
  pass.setPipeline(pipeline); pass.setBindGroup(0, bindGroup);
  pass.dispatchWorkgroups(Math.ceil(threadCount/64)); pass.end();
  const readBuf = device.createBuffer({size:48, usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
  enc.copyBufferToBuffer(resultBuf,0,readBuf,0,48);
  device.queue.submit([enc.finish()]);
  await readBuf.mapAsync(GPUMapMode.READ);
  const ms = performance.now()-t0;
  const out = new Uint32Array(readBuf.getMappedRange().slice(0));
  readBuf.unmap();
  [uniformBuf,baseBuf,offBuf,gBuf,resultBuf,readBuf].forEach(b=>b.destroy());
  return { found: out[0]===1, key: limbsLEToBigint(out.subarray(1,9)), ms, keysPerThread, threadCount };
}

try {
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice();
  const code = await (await fetch('./shaders/search.wgsl')).text();
  const mod = device.createShaderModule({code});
  const info = await mod.getCompilationInfo();
  const errs = info.messages.filter(m=>m.type==='error');
  if (errs.length) throw new Error(errs.map(e=>e.message).join(';'));
  const pipeline = device.createComputePipeline({layout:'auto', compute:{module:mod, entryPoint:'main'}});

  // puzzle71 decode
  const h71 = await addressToHash160(VECTORS.puzzle71Addr);
  log('h71 ' + bytesToHex(h71) + (bytesToHex(h71)===VECTORS.puzzle71Hash160?' OK':' FAIL'));

  const tests = [
    {name:'key1', start:1n, count:64, addr:VECTORS.key1Addr, expect:1n},
    {name:'key2', start:1n, count:64, addr:VECTORS.key2Addr, expect:2n},
    {name:'key3', start:1n, count:64, addr:VECTORS.key3Addr, expect:3n},
    {name:'key5demo', start:1n, count:64, addr: await hash160ToAddress(await hash160(getPublicKey(bigintTo32BE(5n), true))), expect:5n},
  ];
  let all=true;
  for (const t of tests) {
    const words = hash160ToWordsBE(await addressToHash160(t.addr));
    const r = await runChunk(device, pipeline, t.start, t.count, words);
    const ok = r.found && r.key===t.expect;
    all = all && ok;
    log(`${t.name}: ${ok?'PASS':'FAIL'} found=${r.found} key=${r.key} expect=${t.expect} ${r.ms.toFixed(1)}ms thr=${r.threadCount} kpt=${r.keysPerThread}`);
  }
  document.title = all ? 'SELFTEST_OK' : 'SELFTEST_FAIL';
  log(document.title);
} catch (e) {
  log('ERR '+e+' '+e.stack);
  document.title = 'SELFTEST_FAIL';
}
</script></body></html>
